<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<meta name="robots" content="noindex,nofollow">
<title>Atelier — privé</title>

<!-- ── PWA (installable, plein écran) ── -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Atelier">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,18..72,200;0,18..72,300;0,18..72,400;1,18..72,300&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#f4f4f1; --ink:#191814; --ash:#8b8a84; --faint:#b9b8b2;
  --hair:#e2e2dc; --mat:#ffffff; --note:#fcf9ef; --tab:#eceae3;
  --link:#7a7a72;
  --disp:'Newsreader',Georgia,serif; --ui:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ash)}
::selection{background:var(--ink);color:var(--paper)}
body.panning *{user-select:none!important}

/* GATE */
#gate{position:fixed;inset:0;z-index:1000;background:var(--paper);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;transition:opacity .5s,visibility .5s}
#gate.hidden{opacity:0;visibility:hidden}
.gate-card{width:min(380px,92vw);text-align:left}
.gate-card .eyebrow{margin-bottom:18px}
.gate-card h1{font-family:var(--disp);font-weight:300;font-size:40px;line-height:1;margin-bottom:6px}
.gate-card h1 em{font-style:italic}
.gate-card p{color:var(--ash);margin-bottom:30px;line-height:1.6}
.gate-row{display:flex;border:1px solid var(--hair);background:var(--mat)}
.gate-row input{flex:1;border:none;background:none;padding:15px 16px;font-size:16px;color:var(--ink);outline:none;letter-spacing:.04em}
.gate-row button{padding:0 22px;background:var(--ink);color:var(--paper);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.gate-row button:active{opacity:.7}
#gate-err{color:#b4453a;font-size:12px;margin-top:12px;height:14px}
.gate-foot{position:fixed;bottom:calc(26px + var(--safe-b));left:0;right:0;text-align:center}
.gate-foot a{color:var(--ash);text-decoration:none}

/* APP */
#app{height:100%;display:flex;flex-direction:column;opacity:0;transition:opacity .5s}
#app.on{opacity:1}

.bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px clamp(12px,3vw,28px);padding-top:calc(8px + var(--safe-t));
  padding-left:calc(clamp(12px,3vw,28px) + var(--safe-l));padding-right:calc(clamp(12px,3vw,28px) + var(--safe-r));
  border-bottom:1px solid var(--hair);background:rgba(244,244,241,.92);backdrop-filter:blur(8px);z-index:20}
.bar .who{display:flex;align-items:center;gap:14px;min-width:0;flex:0 0 auto}
.bar .who b{font-family:var(--disp);font-weight:300;font-size:22px}
.tabs{display:flex;gap:4px}
.tabbtn{padding:7px 13px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);border:1px solid transparent;border-radius:2px}
.tabbtn.on{color:var(--ink);border-color:var(--hair);background:var(--mat)}
.bar .right{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.saved{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.saved.flash{color:var(--ink)}
.barlink{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);text-decoration:none}

/* sub-bar */
.subbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px clamp(12px,3vw,28px);
  padding-left:calc(clamp(12px,3vw,28px) + var(--safe-l));padding-right:calc(clamp(12px,3vw,28px) + var(--safe-r));
  border-bottom:1px solid var(--hair);background:var(--paper);overflow-x:auto;scrollbar-width:none}
.subbar::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;border:1px solid var(--hair);background:var(--mat);padding:9px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:2px}
.tool:active{border-color:var(--ink)}
.tool.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tool .plus{font-size:15px}
.tool.ghost{border-color:transparent;color:var(--ash)}
.spacer{flex:1 1 auto;min-width:8px}
.boardsel{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--hair);background:var(--mat);border-radius:2px;padding:0 4px 0 12px;position:relative}
.boardsel .bn{font-family:var(--disp);font-size:16px;font-weight:300;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:7px 0}
.boardsel .cv{padding:8px;color:var(--ash);font-size:11px}
.bmenu{position:fixed;min-width:240px;background:var(--mat);border:1px solid var(--hair);box-shadow:0 24px 50px -30px rgba(0,0,0,.5);z-index:200;display:none;max-height:60vh;overflow:auto}
.bmenu.on{display:block}
.bmenu .bi{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--hair)}
.bmenu .bi:active{background:var(--tab)}
.bmenu .bi .nm{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmenu .bi.cur .nm{font-weight:600}
.bmenu .bi .ops{display:flex;gap:4px}
.bmenu .bi .op{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--ash);font-size:13px;border-radius:50%}
.bmenu .bi .op:active{background:rgba(0,0,0,.06);color:var(--ink)}
.bmenu .add{padding:12px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:8px}
.bmenu .add:active{background:var(--tab)}

/* VIEWPORT + CANVAS */
#viewport{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none;overscroll-behavior:none;background:var(--paper)}
#canvas{position:absolute;top:0;left:0;width:2800px;height:1900px;transform-origin:0 0;will-change:transform;
  background-image:radial-gradient(var(--hair) 1.2px,transparent 1.2px);background-size:32px 32px;background-position:-1px -1px}
#links{position:absolute;top:0;left:0;width:2800px;height:1900px;overflow:visible;pointer-events:none;z-index:1}
#links path.wire{fill:none;stroke:var(--link);stroke-width:1.6}
#links .killg{pointer-events:auto;cursor:pointer}
#links .killg circle{fill:var(--paper);stroke:var(--link);stroke-width:1.4}
#links .killg text{fill:var(--link);font-size:13px;font-family:var(--ui);text-anchor:middle;dominant-baseline:central}
#links .killg:active circle{fill:var(--ink)}
#links .killg:active text{fill:var(--paper)}

/* CARD */
.card{position:absolute;background:var(--mat);border:1px solid var(--hair);z-index:5;
  box-shadow:0 1px 0 rgba(0,0,0,.02),0 18px 40px -32px rgba(0,0,0,.5);
  display:flex;flex-direction:column;min-width:150px;min-height:90px}
.card.grab{box-shadow:0 1px 0 rgba(0,0,0,.02),0 32px 60px -26px rgba(0,0,0,.55);z-index:999!important}
.card.csel{outline:2px solid var(--ink);outline-offset:2px}
body.connecting .card{cursor:crosshair}
.card .head{flex:0 0 auto;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 10px;cursor:grab;border-bottom:1px solid var(--hair);background:var(--tab);touch-action:none;user-select:none}
.card.grab .head{cursor:grabbing}
.card .head .tag{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash)}
.card .head .del{font-size:15px;color:var(--faint);width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;flex:0 0 auto}
.card .head .del:active{color:#b4453a;background:rgba(0,0,0,.05)}
.card .body{flex:1 1 auto;overflow:hidden;position:relative;display:flex;flex-direction:column}
.card .rs{position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 52%,var(--faint) 52%,var(--faint) 60%,transparent 60%,transparent 72%,var(--faint) 72%,var(--faint) 80%,transparent 80%);opacity:.7}
.card.note{background:var(--note)}
.card.note .head{background:#f3efe2}
.card .note-text{flex:1;width:100%;border:none;background:none;resize:none;outline:none;font-size:14px;line-height:1.55;color:var(--ink);padding:12px 14px}
.card .note-text::placeholder{color:var(--faint)}
.card.image img{width:100%;height:100%;object-fit:cover;display:block}
.card.image .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ash);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:repeating-linear-gradient(45deg,transparent,transparent 9px,rgba(0,0,0,.02) 9px,rgba(0,0,0,.02) 10px)}
.card.image .cap{position:absolute;left:0;right:0;bottom:0;padding:7px 10px;background:linear-gradient(to top,rgba(0,0,0,.55),transparent);color:#fff;font-size:10px;letter-spacing:.08em}
.card.link .body{padding:14px}
.card .lk-title{font-family:var(--disp);font-size:18px;font-weight:300;line-height:1.2;outline:none;margin-bottom:8px}
.card .lk-title:empty::before{content:'Titre du lien';color:var(--faint)}
.card .lk-url{display:flex;gap:6px;align-items:center}
.card .lk-url input{flex:1;border:none;border-bottom:1px solid var(--hair);background:none;font-size:13px;color:var(--ash);outline:none;padding:4px 0}
.card .lk-go{flex:0 0 auto;border:1px solid var(--hair);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
.card .lk-go:active{background:var(--ink);color:var(--paper)}
.card.project .body{padding:14px}
.card .pr-title{font-family:var(--disp);font-size:21px;font-weight:300;line-height:1.1;outline:none}
.card .pr-title:empty::before{content:'Nom du projet';color:var(--faint)}
.card .pr-status{display:inline-flex;align-items:center;gap:6px;margin:10px 0;padding:6px 11px;border:1px solid var(--hair);font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;user-select:none}
.card .pr-status .dotp{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.card .pr-desc{font-size:13px;line-height:1.55;color:var(--ash);outline:none;flex:1}
.card .pr-desc:empty::before{content:'Notes, intentions, pellicule…';color:var(--faint)}

/* ZOOM */
#zoomctl{position:fixed;right:calc(16px + var(--safe-r));bottom:calc(16px + var(--safe-b));z-index:30;display:flex;flex-direction:column;background:var(--mat);border:1px solid var(--hair);box-shadow:0 10px 30px -18px rgba(0,0,0,.5)}
#zoomctl button{width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink);border-bottom:1px solid var(--hair)}
#zoomctl button:last-child{border-bottom:none}
#zoomctl button:active{background:var(--tab)}
#zoomctl .zlevel{font-size:10px;color:var(--ash);height:34px}
#zoomctl .zfit{font-size:14px}
#zoomctl.hide{display:none}

/* GALLERY */
#gallery{flex:1 1 auto;overflow:auto;display:none;padding:0;padding-bottom:calc(40px + var(--safe-b));-webkit-overflow-scrolling:touch}
#gallery.on{display:flex;flex-direction:column}
.gal-empty{color:var(--ash);text-align:center;padding:60px 20px;line-height:1.7}
.gal-grid{columns:3;column-gap:14px;padding:clamp(16px,3vw,30px)}
@media(max-width:900px){.gal-grid{columns:2}}
@media(max-width:560px){.gal-grid{columns:1}}
.gal-item{break-inside:avoid;margin:0 0 14px;position:relative;background:var(--mat);padding:8px;box-shadow:0 1px 0 var(--hair),0 16px 36px -32px rgba(0,0,0,.5);cursor:zoom-in}
.gal-item img{width:100%;height:auto;display:block;min-height:80px;background:var(--tab)}
.gal-item .gcap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);padding:8px 2px 2px}
.gal-item .gdel{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(244,244,241,.92);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:14px;opacity:0;transition:opacity .2s}
.gal-item:hover .gdel{opacity:1}
@media(hover:none){.gal-item .gdel{opacity:1}}

/* ── vue FICHIERS ── */
#filesview{flex:1 1 auto;overflow:auto;display:none;padding:clamp(16px,3vw,30px);padding-bottom:calc(60px + var(--safe-b));-webkit-overflow-scrolling:touch;max-width:1100px;margin:0 auto;width:100%}
#filesview.on{display:block}
.fv-empty{color:var(--ash);text-align:center;padding:60px 20px;line-height:1.7}
.fv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.fv-item{position:relative;background:var(--mat);border:1px solid var(--hair);box-shadow:0 1px 0 var(--hair),0 16px 36px -32px rgba(0,0,0,.5);display:flex;flex-direction:column}
.fv-thumb{aspect-ratio:4/3;background:var(--tab);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative}
.fv-thumb img,.fv-thumb video{width:100%;height:100%;object-fit:cover;display:block}
.fv-thumb .ic{font-family:var(--disp);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash)}
.fv-thumb .play{position:absolute;width:42px;height:42px;border-radius:50%;background:rgba(25,24,20,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;pointer-events:none}
.fv-meta{padding:10px 12px;border-top:1px solid var(--hair);min-width:0}
.fv-meta .nm{font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv-meta .sub{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.fv-ops{display:flex;border-top:1px solid var(--hair)}
.fv-ops a,.fv-ops button{flex:1;padding:9px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);text-align:center;text-decoration:none;background:none;border:none;border-right:1px solid var(--hair)}
.fv-ops a:last-child,.fv-ops button:last-child{border-right:none}
.fv-ops a:active{background:var(--tab);color:var(--ink)}
.fv-ops .rm:active{background:rgba(180,69,58,.08);color:#b4453a}
.fv-prog{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:11px;padding:10px 16px;z-index:40;display:none}
.fv-prog.on{display:block}

/* lightbox fichiers (réutilise glb mais accepte vidéo) */
#flb{position:fixed;inset:0;z-index:600;background:rgba(244,244,241,.97);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
#flb.on{display:flex}
#flb img,#flb video{max-width:92vw;max-height:84vh;background:var(--mat);padding:12px;box-shadow:0 30px 80px -40px rgba(0,0,0,.6)}
#flb .x{position:fixed;top:calc(20px + var(--safe-t));right:24px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);border:1px solid var(--hair);padding:9px 14px;background:var(--mat)}

/* ── éditeur de site ── */
#siteedit{flex:1 1 auto;overflow:auto;display:none;padding:clamp(18px,4vw,40px);padding-bottom:calc(60px + var(--safe-b));-webkit-overflow-scrolling:touch;max-width:920px;margin:0 auto;width:100%}
#siteedit.on{display:block}
.se-sec{margin:0 0 34px;border:1px solid var(--hair);background:var(--mat)}
.se-sec>.se-h{padding:13px 16px;border-bottom:1px solid var(--hair);background:var(--tab);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);display:flex;align-items:center;justify-content:space-between}
.se-body{padding:16px}
.se-field{margin:0 0 16px}
.se-field:last-child{margin-bottom:0}
.se-field label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);margin-bottom:6px}
.se-field .ed{border:1px solid var(--hair);background:var(--paper);padding:10px 12px;font-size:14px;line-height:1.5;color:var(--ink);outline:none;min-height:20px;font-family:var(--ui)}
.se-field .ed:focus{border-color:var(--ink);background:var(--mat)}
.se-field .ed.disp{font-family:var(--disp);font-weight:300;font-size:20px}
.se-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.se-grid2{grid-template-columns:1fr}}
.se-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:6px}
.se-ph{position:relative;border:1px solid var(--hair);background:var(--paper);cursor:grab;touch-action:none}
.se-ph.drag{opacity:.4}
.se-ph.over{outline:2px solid var(--ink);outline-offset:2px}
.se-ph img{width:100%;height:100px;object-fit:cover;display:block;background:var(--tab)}
.se-ph.hidden img{filter:grayscale(1);opacity:.35}
.se-ph .cap{font-size:10px;color:var(--ash);padding:6px 7px;line-height:1.35;border-top:1px solid var(--hair)}
.se-ph .cap b{display:block;color:var(--ink);font-style:italic;font-family:var(--disp);font-weight:300;font-size:13px}
.se-ph .ops{position:absolute;top:5px;right:5px;display:flex;gap:4px}
.se-ph .ops button{width:26px;height:26px;border-radius:50%;background:rgba(244,244,241,.94);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink);box-shadow:0 2px 8px -3px rgba(0,0,0,.4)}
.se-ph .ops button:active{background:var(--ink);color:var(--paper)}
.se-ph .feat{position:absolute;top:5px;left:5px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:3px 6px}
.se-addrow{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.se-note{font-size:12px;color:var(--ash);line-height:1.6;margin-top:8px}
.se-banner{position:sticky;top:0;z-index:5;background:#eef3ec;border:1px solid #c8dcc4;color:#3a5a36;font-size:12px;padding:9px 14px;margin-bottom:18px;display:none}
.se-banner.on{display:block}
/* sélecteur album (reprend le style boardsel) */
.albumsel{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--hair);background:var(--mat);border-radius:2px;padding:0 4px 0 12px;position:relative}
.albumsel .an{font-family:var(--disp);font-size:16px;font-weight:300;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:7px 0}
.albumsel .cv{padding:8px;color:var(--ash);font-size:11px}
.amenu{position:fixed;min-width:220px;background:var(--mat);border:1px solid var(--hair);box-shadow:0 24px 50px -30px rgba(0,0,0,.5);z-index:200;display:none;max-height:60vh;overflow:auto}
.amenu.on{display:block}
.amenu .ai{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--hair)}
.amenu .ai:active{background:var(--tab)}
.amenu .ai .nm{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amenu .ai.cur .nm{font-weight:600}
.amenu .ai .ops{display:flex;gap:4px}
.amenu .ai .op{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--ash);font-size:13px;border-radius:50%}
.amenu .ai .op:active{background:rgba(0,0,0,.06);color:var(--ink)}
.amenu .add{padding:12px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:8px}
.amenu .add:active{background:var(--tab)}

/* PICKER */
#picker{position:fixed;inset:0;z-index:500;background:rgba(25,24,20,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
#picker.on{display:flex}
.pk-panel{background:var(--paper);width:min(720px,96vw);max-height:84vh;display:flex;flex-direction:column;border:1px solid var(--hair);box-shadow:0 40px 90px -40px rgba(0,0,0,.6)}
.pk-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--hair)}
.pk-head h3{font-family:var(--disp);font-weight:300;font-size:22px}
.pk-upload{padding:14px 20px;border-bottom:1px solid var(--hair)}
.pk-filebtn{width:100%;padding:14px;border:1px dashed var(--ash);background:var(--mat);color:var(--ink);font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:9px}
.pk-filebtn:active{border-color:var(--ink);background:var(--tab)}
.pk-filebtn .ic{font-size:16px}
.pk-url{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--hair)}
.pk-url input{flex:1;border:1px solid var(--hair);background:var(--mat);padding:11px 12px;font-size:16px;outline:none}
.pk-url button{padding:0 16px;background:var(--ink);color:var(--paper);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.pk-or{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);padding:12px 20px 0}
.pk-grid{overflow:auto;padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;-webkit-overflow-scrolling:touch}
.pk-grid figure{cursor:pointer;background:var(--mat);border:1px solid var(--hair)}
.pk-grid figure:active{border-color:var(--ink);transform:translateY(-2px)}
.pk-grid img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.pk-grid figcaption{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);padding:5px 7px}
.pk-close{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}

/* LIGHTBOX */
#glb{position:fixed;inset:0;z-index:600;background:rgba(244,244,241,.97);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center}
#glb.on{display:flex}
#glb img{max-width:92vw;max-height:84vh;background:var(--mat);padding:12px;box-shadow:0 30px 80px -40px rgba(0,0,0,.6)}
#glb .x{position:fixed;top:calc(20px + var(--safe-t));right:24px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);border:1px solid var(--hair);padding:9px 14px}
#glb .gn{position:fixed;top:50%;transform:translateY(-50%);font-family:var(--disp);font-size:34px;color:var(--faint);padding:18px}
#glb .gp{left:8px}#glb .gx{right:8px}

.hint{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:11px;padding:10px 16px;opacity:0;transition:opacity .35s;pointer-events:none;z-index:40;text-align:center;max-width:90vw}
.hint.show{opacity:.92}

@media(max-width:680px){
  .bar .who b{font-size:19px}
  .bar .barlink{display:none}
}

/* ════════ LIQUID GLASS — appliqué UNIQUEMENT en PWA installée (body.pwa) ════════ */
body.pwa *, body.pwa *::before, body.pwa *::after{margin:0;padding:0;box-sizing:border-box}
body.pwa{
  /* palette liquid glass — clair, profond, irisé */
  --paper:#eef1f6; --ink:#10131a; --ash:#5b6170; --faint:#9aa1b2;
  --hair:rgba(255,255,255,.55); --hair2:rgba(120,130,150,.18);
  --mat:rgba(255,255,255,.62); --note:rgba(255,250,235,.62); --tab:rgba(255,255,255,.4);
  --link:#5e6577;
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-edge:rgba(255,255,255,.85);
  --glass-shadow:0 8px 32px -8px rgba(20,28,48,.28),0 2px 8px -2px rgba(20,28,48,.18);
  --glass-shadow-lg:0 24px 60px -18px rgba(20,28,48,.42),0 4px 14px -4px rgba(20,28,48,.22);
  --inner-light:inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 .5px rgba(255,255,255,.4);
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.16);
  --disp:'Newsreader',Georgia,serif; --ui:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --r:18px; --r-sm:13px; --r-xs:9px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
body.pwa, body.pwa{height:100%;overflow:hidden;overscroll-behavior:none}
body.pwa{
  color:var(--ink);font-family:var(--ui);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(1100px 800px at 12% -8%,rgba(120,170,255,.5),transparent 60%),
    radial-gradient(900px 700px at 100% 0%,rgba(255,170,210,.42),transparent 55%),
    radial-gradient(1000px 900px at 50% 120%,rgba(150,230,200,.4),transparent 55%),
    linear-gradient(160deg,#eef2f9,#e6ebf4 55%,#eef1f6);
  background-attachment:fixed;
}
body.pwa button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
body.pwa .label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ash)}
body.pwa ::selection{background:var(--accent);color:#fff}
body.pwa.panning *{user-select:none!important}

/* utilitaire verre */
body.pwa .glass{background:var(--glass);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow),var(--inner-light)}

/* GATE */
body.pwa #gate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;transition:opacity .5s,visibility .5s;
  background:
    radial-gradient(900px 700px at 15% 0%,rgba(120,170,255,.55),transparent 60%),
    radial-gradient(800px 700px at 95% 10%,rgba(255,160,205,.5),transparent 55%),
    radial-gradient(900px 800px at 50% 115%,rgba(150,230,200,.5),transparent 55%),
    linear-gradient(160deg,#eef2f9,#e6ebf4)}
body.pwa #gate.hidden{opacity:0;visibility:hidden}
body.pwa .gate-card{width:min(400px,92vw);text-align:left;padding:34px 30px 30px;border-radius:26px;
  background:var(--glass-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow-lg),var(--inner-light)}
body.pwa .gate-card .eyebrow{margin-bottom:18px}
body.pwa .gate-card h1{font-family:var(--disp);font-weight:300;font-size:44px;line-height:1;margin-bottom:8px}
body.pwa .gate-card h1 em{font-style:italic}
body.pwa .gate-card p{color:var(--ash);margin-bottom:28px;line-height:1.6}
body.pwa .gate-card input{border-radius:14px!important}
body.pwa .gate-row{display:flex;gap:8px;border:none;background:none}
body.pwa .gate-row input{flex:1;border:.5px solid var(--hair2);background:rgba(255,255,255,.7);padding:15px 16px;font-size:16px;color:var(--ink);outline:none;letter-spacing:.04em;border-radius:14px;box-shadow:inset 0 1px 2px rgba(20,28,48,.06)}
body.pwa .gate-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
body.pwa .gate-row button{padding:0 24px;background:linear-gradient(180deg,#1f2533,#10131a);color:#fff;font-size:11px;letter-spacing:.18em;text-transform:uppercase;border-radius:14px;box-shadow:0 6px 16px -6px rgba(20,28,48,.5),var(--inner-light)}
body.pwa .gate-row button:active{transform:scale(.97)}
body.pwa #gate-err{color:#e0524a;font-size:12px;margin-top:12px;height:14px}
body.pwa .gate-foot{position:fixed;bottom:calc(26px + var(--safe-b));left:0;right:0;text-align:center}
body.pwa .gate-foot a{color:var(--ash);text-decoration:none}

/* APP */
body.pwa #app{height:100%;display:flex;flex-direction:column;opacity:0;transition:opacity .5s}
body.pwa #app.on{opacity:1}

body.pwa .bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px clamp(12px,3vw,28px);padding-top:calc(10px + var(--safe-t));
  padding-left:calc(clamp(12px,3vw,28px) + var(--safe-l));padding-right:calc(clamp(12px,3vw,28px) + var(--safe-r));
  background:rgba(255,255,255,.5);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border-bottom:.5px solid var(--glass-edge);box-shadow:0 1px 0 rgba(255,255,255,.6),0 6px 20px -12px rgba(20,28,48,.25);z-index:20}
body.pwa .bar .who{display:flex;align-items:center;gap:14px;min-width:0;flex:0 0 auto}
body.pwa .bar .who b{font-family:var(--disp);font-weight:300;font-size:23px}
body.pwa .tabs{display:flex;gap:4px;padding:3px;background:rgba(120,130,150,.12);border-radius:13px;border:.5px solid var(--hair)}
body.pwa .tabbtn{padding:7px 14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);border:none;border-radius:10px;transition:.2s var(--ease)}
body.pwa .tabbtn.on{color:var(--ink);background:var(--glass-strong);box-shadow:0 2px 8px -2px rgba(20,28,48,.2),var(--inner-light)}
body.pwa .bar .right{display:flex;align-items:center;gap:9px;flex:0 0 auto}
body.pwa .saved{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
body.pwa .saved.flash{color:var(--accent)}
body.pwa .barlink{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);text-decoration:none}

/* sub-bar */
body.pwa .subbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px clamp(12px,3vw,28px);
  padding-left:calc(clamp(12px,3vw,28px) + var(--safe-l));padding-right:calc(clamp(12px,3vw,28px) + var(--safe-r));
  background:rgba(255,255,255,.32);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
  border-bottom:.5px solid var(--hair);overflow-x:auto;scrollbar-width:none}
body.pwa .subbar::-webkit-scrollbar{display:none}
body.pwa .tool{flex:0 0 auto;border:.5px solid var(--glass-edge);background:var(--glass);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  padding:9px 14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:12px;
  box-shadow:0 2px 8px -3px rgba(20,28,48,.18),var(--inner-light);transition:.18s var(--ease)}
body.pwa .tool:active{transform:scale(.96)}
body.pwa .tool.on{background:linear-gradient(180deg,#1f2533,#10131a);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(20,28,48,.5)}
body.pwa .tool .plus{font-size:15px}
body.pwa .tool.ghost{border-color:transparent;background:rgba(255,255,255,.25);color:var(--ash);box-shadow:none}
body.pwa .spacer{flex:1 1 auto;min-width:8px}
body.pwa .boardsel, body.pwa .albumsel{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:.5px solid var(--glass-edge);background:var(--glass);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-radius:12px;padding:0 4px 0 13px;position:relative;box-shadow:0 2px 8px -3px rgba(20,28,48,.18),var(--inner-light)}
body.pwa .boardsel .bn, body.pwa .albumsel .an{font-family:var(--disp);font-size:16px;font-weight:300;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 0}
body.pwa .boardsel .cv, body.pwa .albumsel .cv{padding:8px;color:var(--ash);font-size:11px}
body.pwa .bmenu, body.pwa .amenu{position:fixed;min-width:240px;border-radius:var(--r);background:var(--glass-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow-lg),var(--inner-light);z-index:200;display:none;max-height:60vh;overflow:auto;padding:6px}
body.pwa .amenu{min-width:220px}
body.pwa .bmenu.on, body.pwa .amenu.on{display:block}
body.pwa .bmenu .bi, body.pwa .amenu .ai{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:.5px solid var(--hair2);border-radius:11px}
body.pwa .bmenu .bi:last-of-type, body.pwa .amenu .ai:last-of-type{border-bottom:none}
body.pwa .bmenu .bi:active, body.pwa .amenu .ai:active{background:rgba(255,255,255,.6)}
body.pwa .bmenu .bi .nm, body.pwa .amenu .ai .nm{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.pwa .bmenu .bi.cur .nm, body.pwa .amenu .ai.cur .nm{font-weight:600}
body.pwa .bmenu .bi .ops, body.pwa .amenu .ai .ops{display:flex;gap:4px}
body.pwa .bmenu .bi .op, body.pwa .amenu .ai .op{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ash);font-size:13px;border-radius:50%}
body.pwa .bmenu .bi .op:active, body.pwa .amenu .ai .op:active{background:rgba(20,28,48,.08);color:var(--ink)}
body.pwa .bmenu .add, body.pwa .amenu .add{padding:12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px;border-radius:11px}
body.pwa .bmenu .add:active, body.pwa .amenu .add:active{background:rgba(255,255,255,.6)}

/* VIEWPORT + CANVAS */
body.pwa #viewport{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none;overscroll-behavior:none}
body.pwa #canvas{position:absolute;top:0;left:0;width:2800px;height:1900px;transform-origin:0 0;will-change:transform;
  background-image:radial-gradient(rgba(120,130,160,.25) 1.2px,transparent 1.2px);background-size:34px 34px;background-position:-1px -1px}
body.pwa #links{position:absolute;top:0;left:0;width:2800px;height:1900px;overflow:visible;pointer-events:none;z-index:1}
body.pwa #links path.wire{fill:none;stroke:var(--link);stroke-width:1.8;stroke-linecap:round;filter:drop-shadow(0 1px 2px rgba(20,28,48,.2))}
body.pwa #links .killg{pointer-events:auto;cursor:pointer}
body.pwa #links .killg circle{fill:rgba(255,255,255,.85);stroke:var(--link);stroke-width:1.4}
body.pwa #links .killg text{fill:var(--link);font-size:13px;font-family:var(--ui);text-anchor:middle;dominant-baseline:central}
body.pwa #links .killg:active circle{fill:var(--ink)}
body.pwa #links .killg:active text{fill:#fff}

/* CARD */
body.pwa .card{position:absolute;border-radius:var(--r);z-index:5;
  background:var(--glass-strong);backdrop-filter:blur(24px) saturate(185%);-webkit-backdrop-filter:blur(24px) saturate(185%);
  border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow),var(--inner-light);
  display:flex;flex-direction:column;min-width:150px;min-height:90px;overflow:hidden}
body.pwa .card.grab{box-shadow:var(--glass-shadow-lg);z-index:999!important;transform-origin:center}
body.pwa .card.csel{outline:2px solid var(--accent);outline-offset:3px}
body.pwa.connecting .card{cursor:crosshair}
body.pwa .card .head{flex:0 0 auto;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;cursor:grab;
  border-bottom:.5px solid var(--hair2);background:rgba(255,255,255,.4);touch-action:none;user-select:none}
body.pwa .card.grab .head{cursor:grabbing}
body.pwa .card .head .tag{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash)}
body.pwa .card .head .del{font-size:15px;color:var(--faint);width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;flex:0 0 auto}
body.pwa .card .head .del:active{color:#e0524a;background:rgba(20,28,48,.06)}
body.pwa .card .body{flex:1 1 auto;overflow:hidden;position:relative;display:flex;flex-direction:column}
body.pwa .card .rs{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 52%,var(--faint) 52%,var(--faint) 60%,transparent 60%,transparent 72%,var(--faint) 72%,var(--faint) 80%,transparent 80%);opacity:.6}
body.pwa .card.note{background:linear-gradient(180deg,rgba(255,252,240,.78),rgba(255,248,228,.66))}
body.pwa .card.note .head{background:rgba(255,248,228,.5)}
body.pwa .card .note-text{flex:1;width:100%;border:none;background:none;resize:none;outline:none;font-size:14px;line-height:1.55;color:var(--ink);padding:13px 15px}
body.pwa .card .note-text::placeholder{color:var(--faint)}
body.pwa .card.image img{width:100%;height:100%;object-fit:cover;display:block}
body.pwa .card.image .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ash);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:repeating-linear-gradient(45deg,transparent,transparent 9px,rgba(20,28,48,.03) 9px,rgba(20,28,48,.03) 10px)}
body.pwa .card.image .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 11px;background:linear-gradient(to top,rgba(10,14,24,.6),transparent);color:#fff;font-size:10px;letter-spacing:.08em}
body.pwa .card.link .body{padding:15px}
body.pwa .card .lk-title{font-family:var(--disp);font-size:18px;font-weight:300;line-height:1.2;outline:none;margin-bottom:8px}
body.pwa .card .lk-title:empty::before{content:'Titre du lien';color:var(--faint)}
body.pwa .card .lk-url{display:flex;gap:6px;align-items:center}
body.pwa .card .lk-url input{flex:1;border:none;border-bottom:.5px solid var(--hair2);background:none;font-size:13px;color:var(--ash);outline:none;padding:4px 0}
body.pwa .card .lk-go{flex:0 0 auto;border:.5px solid var(--hair2);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:rgba(255,255,255,.5)}
body.pwa .card .lk-go:active{background:var(--accent);color:#fff;border-color:transparent}
body.pwa .card.project .body{padding:15px}
body.pwa .card .pr-title{font-family:var(--disp);font-size:21px;font-weight:300;line-height:1.1;outline:none}
body.pwa .card .pr-title:empty::before{content:'Nom du projet';color:var(--faint)}
body.pwa .card .pr-status{display:inline-flex;align-items:center;gap:6px;margin:10px 0;padding:6px 12px;border:.5px solid var(--hair2);border-radius:20px;background:rgba(255,255,255,.5);font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;user-select:none}
body.pwa .card .pr-status .dotp{width:6px;height:6px;border-radius:50%;background:var(--accent)}
body.pwa .card .pr-desc{font-size:13px;line-height:1.55;color:var(--ash);outline:none;flex:1}
body.pwa .card .pr-desc:empty::before{content:'Notes, intentions, pellicule…';color:var(--faint)}

/* ZOOM */
body.pwa #zoomctl{position:fixed;right:calc(16px + var(--safe-r));bottom:calc(16px + var(--safe-b));z-index:30;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
  background:var(--glass-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow-lg),var(--inner-light)}
body.pwa #zoomctl button{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink);border-bottom:.5px solid var(--hair2)}
body.pwa #zoomctl button:last-child{border-bottom:none}
body.pwa #zoomctl button:active{background:rgba(255,255,255,.55)}
body.pwa #zoomctl .zlevel{font-size:10px;color:var(--ash);height:34px}
body.pwa #zoomctl .zfit{font-size:14px}
body.pwa #zoomctl.hide{display:none}

/* GALLERY */
body.pwa #gallery{flex:1 1 auto;overflow:auto;display:none;padding:0;padding-bottom:calc(40px + var(--safe-b));-webkit-overflow-scrolling:touch}
body.pwa #gallery.on{display:flex;flex-direction:column}
body.pwa .gal-empty{color:var(--ash);text-align:center;padding:60px 20px;line-height:1.7}
body.pwa .gal-grid{columns:3;column-gap:14px;padding:clamp(16px,3vw,30px)}
@media(max-width:900px){body.pwa .gal-grid{columns:2}}
@media(max-width:560px){body.pwa .gal-grid{columns:1}}
body.pwa .gal-item{break-inside:avoid;margin:0 0 14px;position:relative;border-radius:var(--r);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:8px;border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow),var(--inner-light);cursor:zoom-in;overflow:hidden}

<script>
/* Active le thème "liquid glass" UNIQUEMENT quand la page tourne en PWA installée
   (écran d'accueil iOS, ou app installée Android/PC). En onglet navigateur normal,
   on garde le design d'origine. */
(function(){
  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches
        || window.matchMedia('(display-mode: fullscreen)').matches
        || window.matchMedia('(display-mode: minimal-ui)').matches
        || window.navigator.standalone === true; /* iOS Safari */
  }
  function apply(){
    if(isStandalone()){
      document.body.classList.add('pwa');
      var tc=document.querySelector('meta[name="theme-color"]');
      if(tc) tc.setAttribute('content','#e6ebf4');
    } else {
      document.body.classList.remove('pwa');
    }
  }
  apply();
  try{ window.matchMedia('(display-mode: standalone)').addEventListener('change',apply); }catch(e){}
})();
</script>

function collectImgRefs(s){
  // retourne tous les objets {obj, key} dont la valeur src est un data: URL
  const refs=[];
  (s.boards||[]).forEach(b=>(b.items||[]).forEach(it=>{
    if(it.type==='image'&&it.data){
      if(it.data.src&&it.data.src.startsWith('data:')) refs.push({obj:it.data,key:'src',id:it.id});
    }
  }));
  (s.albums||[]).forEach(al=>(al.images||[]).forEach(g=>{
    if(g.src&&g.src.startsWith('data:')) refs.push({obj:g,key:'src',id:g.id});
  }));
  return refs;
}
function stripImages(s){
  const copy=JSON.parse(JSON.stringify(s));
  // retirer TOUS les data: URLs du doc principal
  (copy.boards||[]).forEach(b=>(b.items||[]).forEach(it=>{
    if(it.type==='image'&&it.data&&it.data.src&&it.data.src.startsWith('data:')){
      it.data._imgRef=it.id; it.data.src='__ref__';
    }
  }));
  (copy.albums||[]).forEach(al=>{
    al.images=(al.images||[]).map(g=>{
      if(g.src&&g.src.startsWith('data:'))return{...g,src:'__ref__',_imgRef:g.id};
      return g;
    });
  });
  // vérification : aucun data: ne doit subsister
  const json=JSON.stringify(copy);
  if(json.includes('"data:')){ console.error('STRIP INCOMPLET — data: encore présent'); }
  return copy;
}
async function saveImages(db,uid,s){
  const col=db.collection('ateliers').doc(uid).collection('imgs');
  const refs=collectImgRefs(s);
  if(!refs.length)return;
  await Promise.all(refs.map(r=>col.doc(r.id).set({src:r.obj[r.key]})));
}
/* ── CACHE d'images + chargement paresseux (à l'affichage, pas au démarrage) ── */
const imgCache=new Map();          // id -> dataURL (déjà téléchargé)
const imgPending=new Map();        // id -> Promise en cours
function imgColl(){ return firebase.firestore().collection('ateliers').doc(fbUser.uid).collection('imgs'); }
async function fetchImg(id){
  if(imgCache.has(id)) return imgCache.get(id);
  if(imgPending.has(id)) return imgPending.get(id);
  const p=imgColl().doc(id).get().then(sn=>{ const src=sn.exists?(sn.data().src||''):''; imgCache.set(id,src); imgPending.delete(id); return src; })
                            .catch(()=>{ imgPending.delete(id); return ''; });
  imgPending.set(id,p); return p;
}
/* Résout la src d'une <img> : si _imgRef, télécharge à la demande puis remplit. */
function resolveImgEl(imgEl, src, ref){
  if(src && src!=='__ref__'){ imgEl.src=src; return; }
  if(!ref){ return; }
  if(imgCache.has(ref)){ const v=imgCache.get(ref); if(v) imgEl.src=v; return; }
  fetchImg(ref).then(v=>{ if(v) imgEl.src=v; });
}

/* ── réparation au démarrage : nettoyer les data: coincés dans le doc principal ── */
async function repairImages(db,uid){
  try{
    const snap=await fbDoc.get();
    if(!snap.exists||!snap.data().json)return;
    const s=JSON.parse(snap.data().json);
    const refs=collectImgRefs(s); if(!refs.length)return;
    // il y a des data: dans le doc principal → les extraire et réécrire
    flash("Réparation en cours…");
    await saveImages(db,uid,s);
    const light=stripImages(s);
    const json=JSON.stringify(light); lastJSON=json;
    await fbDoc.set({json,ts:Date.now()});
    flash("Réparation terminée ✓");
  }catch(e){ console.warn('repair failed',e); }
}

function persist(immediate){
  if(USE_FB){
    if(!fbDoc) return;
    clearTimeout(saveT2);
    const write=async()=>{
      const db=firebase.firestore();
      // 1) sauver les images data: dans la sous-collection imgs/
      const refs=collectImgRefs(state);
      await Promise.all(refs.map(r=>imgColl().doc(r.id).set({src:r.obj[r.key]})));
      // 2) garder ces images en cache et alléger l'état EN MÉMOIRE (évite de tout re-garder en RAM)
      refs.forEach(r=>{ imgCache.set(r.id, r.obj[r.key]); r.obj._imgRef=r.id; r.obj[r.key]='__ref__'; });
      // 3) écrire le doc principal (léger) en fusion pour ne pas écraser d'autres champs
      const json=JSON.stringify(state); lastJSON=json;
      await fbDoc.set({json,ts:Date.now()},{merge:true});
      flagSaved();
    };
    immediate?write().catch(e=>{ document.getElementById('saved').textContent="erreur synchro"; console.error(e); })
              :(saveT2=setTimeout(()=>write().catch(e=>{ document.getElementById('saved').textContent="erreur synchro"; console.error(e); }),600));
  } else { Store.save(); }
}

let galView={all:false, sort:'manual'}; // sort: 'manual' | 'date' | 'shuffle'

function allImages(){
  const out=[];
  (state.albums||[]).forEach(a=>(a.images||[]).forEach(g=>out.push(Object.assign({_album:a.name},g))));
  return out;
}
function sortedList(imgs){
  let arr=imgs.slice();
  if(galView.sort==='date') arr.sort((a,b)=>(b.added||0)-(a.added||0));
  else if(galView.sort==='shuffle'){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} }
  return arr;
}
function renderGallery(){
  // synchro de l'UI des boutons
  document.getElementById('gal-all').classList.toggle('on',galView.all);
  document.getElementById('gal-shuffle').classList.toggle('on',galView.sort==='shuffle');
  document.getElementById('gal-sort').classList.toggle('on',galView.sort==='date');
  document.querySelector('#subbar-gallery .albumsel').style.display=galView.all?'none':'flex';

  const base=galView.all?allImages():((activeAlbumObj()||{}).images||[]);
  galCurrent=sortedList(base);

/* upload + compression */
function fileToDataURL(file,maxDim=800,q=0.72){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file),img=new Image(); img.onload=()=>{ URL.revokeObjectURL(url); let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,m=Math.max(w,h); if(m>maxDim){const r=maxDim/m;w=Math.round(w*r);h=Math.round(h*r);} const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h); try{res(c.toDataURL('image/jpeg',q));}catch(e){rej(e);} }; img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('x'));}; img.src=url; }); }
async function handleFiles(list){
  const files=[...list].filter(f=>f.type&&f.type.startsWith('image/'));
  if(!files.length){flash("Aucune image reconnue");return;}
  flash(files.length>1?`Import de ${files.length} photos…`:"Import en cours…");
  let first=true,k=0;
  for(const f of files){
    try{ const data=await fileToDataURL(f); const src=await materialize(data);
      if(pickMode==='gallery'){ const al=activeAlbumObj(); if(al){ al.images=al.images||[]; al.images.unshift({id:uid8('g'),src,cap:"",added:Date.now()}); } }
      else if(first&&pickTarget){ pickTarget.data.src=src;pickTarget.data.cap="";renderCard(pickTarget);drawLinks();first=false; }
      else { const it=add('image',{data:{src,cap:""}},true); it.x+=k*30;it.y+=k*30;renderCard(it); }
      k++;
    }catch(e){ flash("Une photo n'a pas pu être importée"); }
  }
  if(pickMode==='gallery')renderGallery();
  save(); closePicker(); flash(files.length>1?`${files.length} photos importées`:"Photo importée");
}

function setSitePhotoSrc(imgEl, ph){
  if(ph.full){ imgEl.src=ph.full; return; }
  if(ph.upload){
    if(siteImgCache.has(ph.img)){ imgEl.src=siteImgCache.get(ph.img); return; }
    siteImgsCol().doc(ph.img).get().then(sn=>{ const s=sn.exists?sn.data().src:''; siteImgCache.set(ph.img,s); if(s)imgEl.src=s; }).catch(()=>{});
  } else { imgEl.src='images/'+ph.img; }
}

/* ── grille de photos d'une série, avec drag-reorder ── */
function photoGrid(sid){
  const ov=siteWorking();
  const grid=el('div','se-photos'); grid.dataset.sid=sid;
  (ov.series[sid]||[]).forEach((p,i)=>grid.appendChild(photoCell(sid,p,i)));

}
function photoCell(sid,p,i){
  const ov=siteWorking();
  const c=el('div','se-ph'+(p.hidden?' hidden':'')); c.draggable=true; c.dataset.i=i;
  const img=el('img'); setSitePhotoSrc(img,p); c.appendChild(img);
  if(p.feature){ const fe=el('span','feat'); fe.textContent='Pleine largeur'; c.appendChild(fe); }
  const ops=el('div','ops');
  const eye=el('button'); eye.textContent=p.hidden?'◯':'⦿'; eye.title='Afficher/masquer';
  eye.addEventListener('click',ev=>{ev.stopPropagation(); p.hidden=!p.hidden; markSiteDirty(); renderSeriesGrid(sid);});
  const star=el('button'); star.textContent='▭'; star.title='Pleine largeur';
  star.addEventListener('click',ev=>{ev.stopPropagation(); p.feature=!p.feature; markSiteDirty(); renderSeriesGrid(sid);});
  const del=el('button'); del.textContent='✕'; del.title='Retirer';
  del.addEventListener('click',ev=>{ev.stopPropagation(); ov.series[sid]=ov.series[sid].filter(x=>x!==p); markSiteDirty(); renderSeriesGrid(sid);});
  ops.appendChild(eye); ops.appendChild(star); ops.appendChild(del); c.appendChild(ops);
  const cap=el('div','cap');
  cap.innerHTML='<b></b><span></span>';
  cap.querySelector('b').textContent=p.title||'(sans titre)';
  cap.querySelector('span').textContent=p.label||'';
  c.appendChild(cap);
  // édition titre/label au double-clic
  c.addEventListener('dblclick',()=>{
    const t=prompt("Titre de la photo",p.title||''); if(t!==null){p.title=t;}
    const l=prompt("Légende (ex: 01.03 · HP5+ 400)",p.label||''); if(l!==null){p.label=l;}
    markSiteDirty(); renderSeriesGrid(sid);
  });
  // drag & drop
  c.addEventListener('dragstart',e=>{ c.classList.add('drag'); e.dataTransfer.setData('text/plain',i); e.dataTransfer.effectAllowed='move'; });
  c.addEventListener('dragend',()=>c.classList.remove('drag'));
  c.addEventListener('dragover',e=>{ e.preventDefault(); c.classList.add('over'); });
  c.addEventListener('dragleave',()=>c.classList.remove('over'));
  c.addEventListener('drop',e=>{ e.preventDefault(); c.classList.remove('over');
    const from=+e.dataTransfer.getData('text/plain'), to=i;
    if(from===to)return; const arr=ov.series[sid]; const [m]=arr.splice(from,1); arr.splice(to,0,m);
    markSiteDirty(); renderSeriesGrid(sid);
  });
  // réordonnancement tactile (drag HTML5 ne marche pas sur iOS) : flèches
  const moveRow=el('div'); moveRow.style.cssText='position:absolute;bottom:34px;left:5px;display:flex;gap:4px';
  const mk=(txt,d)=>{ const b=el('button'); b.textContent=txt; b.style.cssText='width:24px;height:24px;border-radius:50%;background:rgba(244,244,241,.94);font-size:12px;box-shadow:0 2px 8px -3px rgba(0,0,0,.4)';
    b.addEventListener('click',ev=>{ev.stopPropagation(); const arr=ov.series[sid]; const ni=i+d; if(ni<0||ni>=arr.length)return; [arr[i],arr[ni]]=[arr[ni],arr[i]]; markSiteDirty(); renderSeriesGrid(sid);}); return b; };
  moveRow.appendChild(mk('‹',-1)); moveRow.appendChild(mk('›',1));
  c.appendChild(moveRow);
  return c;
}
function renderSeriesGrid(sid){
  const old=document.querySelector('.se-photos[data-sid="'+sid+'"]');
  if(old) old.replaceWith(photoGrid(sid));
}

/* ════════════════ FICHIERS — cloud Cloudinary ════════════════
   Stockage des fichiers (images/vidéos/PDF) chez Cloudinary (gratuit).
   Seul un index léger (nom, type, url, date) est gardé dans state.files,
   synchronisé via Firestore comme le reste de l'atelier.
   Upload non signé : aucune clé secrète n'est exposée ici. */
const CLOUDINARY = { cloudName:"dzq1a6leu", uploadPreset:"site-raphael" };

/* URL de ton Cloudflare Worker de suppression (à remplir après déploiement).
   Tant qu'elle est vide, « Supprimer » retire seulement de la liste. */
const DELETE_WORKER_URL = "https://cloudinary-delete.raphaelguerin06.workers.dev/";

async function deleteFile(f){
  if(!confirm("Supprimer définitivement « "+f.name+" » ?\n\nLe fichier sera effacé de Cloudinary ET de la liste."))return;
  // Pas de Worker configuré -> on retire juste de la liste
  if(!DELETE_WORKER_URL || !f.public_id){
    state.files=(state.files||[]).filter(x=>x.id!==f.id); renderFiles(); save();
    flash(DELETE_WORKER_URL? "Retiré (public_id manquant)":"Retiré de la liste");
    return;
  }
  showProg("Suppression…");
  try{
    const res=await fetch(DELETE_WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ public_id:f.public_id, resource_type:f.resource_type||"image" })
    });
    const data=await res.json().catch(()=>({}));
    if(res.ok && (data.result==="ok"||data.result==="not found")){
      state.files=(state.files||[]).filter(x=>x.id!==f.id); renderFiles(); save();
      flash(data.result==="not found"?"Déjà absent de Cloudinary — retiré":"Supprimé de Cloudinary ✓");
    } else {
      flash("Échec suppression : "+(data.error||data.result||res.status));
    }
  }catch(e){ console.error(e); flash("Suppression impossible (Worker injoignable)"); }
  finally{ hideProg(); }
}

function fmtSize(b){ if(!b&&b!==0)return""; if(b<1024)return b+" o"; if(b<1048576)return (b/1024).toFixed(0)+" Ko"; return (b/1048576).toFixed(1)+" Mo"; }
function fileKind(f){ const t=f.type||""; if(t.startsWith('image/'))return'image'; if(t.startsWith('video/'))return'video'; if(t==='application/pdf')return'pdf'; return'raw'; }

/* upload d'un fichier vers Cloudinary, renvoie l'entrée d'index */
function cloudinaryUpload(file,onProgress){
  return new Promise((resolve,reject)=>{
    const url=`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/auto/upload`;
    const fd=new FormData();
    fd.append('file',file);
    fd.append('upload_preset',CLOUDINARY.uploadPreset);
    const xhr=new XMLHttpRequest();
    xhr.open('POST',url);
    xhr.upload.onprogress=e=>{ if(e.lengthComputable&&onProgress)onProgress(e.loaded/e.total); };
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300){
        try{
          const r=JSON.parse(xhr.responseText);
          resolve({
            id:uid8('f'),
            name:file.name||(r.original_filename||'fichier'),
            kind:fileKind(file),
            url:r.secure_url,
            public_id:r.public_id||'',
            resource_type:r.resource_type||'image',
            bytes:r.bytes||file.size||0,
            format:r.format||'',
            width:r.width||0, height:r.height||0,
            added:Date.now()
          });
        }catch(e){ reject(e); }
      } else {
        let msg="Upload refusé ("+xhr.status+")";
        try{ const r=JSON.parse(xhr.responseText); if(r.error&&r.error.message)msg=r.error.message; }catch(e){}
        reject(new Error(msg));
      }
    };
    xhr.onerror=()=>reject(new Error("Connexion interrompue"));
    xhr.send(fd);
  });
}

const filesProg=(()=>{ const d=document.createElement('div'); d.className='fv-prog'; d.id='fv-prog'; document.body.appendChild(d); return d; })();
function showProg(t){ filesProg.textContent=t; filesProg.classList.add('on'); }
function hideProg(){ filesProg.classList.remove('on'); }

async function handleFileUploads(list){
  const files=[...list];
  if(!files.length)return;
  if(!state.files)state.files=[];
  let done=0, failed=0;
  for(const f of files){
    showProg(`Envoi ${done+1}/${files.length} — ${f.name}`);
    try{
      const entry=await cloudinaryUpload(f,p=>{ showProg(`Envoi ${done+1}/${files.length} — ${Math.round(p*100)}%`); });
      state.files.unshift(entry);
      done++;
      renderFiles(); save();
    }catch(e){ failed++; console.error(e); flash("Échec : "+(e.message||f.name)); }
  }
  hideProg();
  flash(failed? `${done} envoyé(s), ${failed} échec(s)` : (done>1?`${done} fichiers envoyés ✓`:"Fichier envoyé ✓"));
}

function renderFiles(){
  const root=document.getElementById('filesview');
  const list=(state&&state.files)||[];
  const cnt=document.getElementById('files-count');
  if(cnt)cnt.textContent=list.length?(list.length+" fichier"+(list.length>1?"s":"")):"";
  root.innerHTML='';
  if(!list.length){
    const e=document.createElement('div'); e.className='fv-empty';
    e.innerHTML="Aucun fichier pour l'instant.<br>Touche « + Téléverser » pour envoyer images, vidéos ou PDF.";
    root.appendChild(e); return;
  }
  const grid=document.createElement('div'); grid.className='fv-grid';
  list.forEach(f=>{
    const it=document.createElement('div'); it.className='fv-item';
    const thumb=document.createElement('div'); thumb.className='fv-thumb';
    if(f.kind==='image'){ const img=document.createElement('img'); img.src=f.url; img.loading='lazy'; thumb.appendChild(img); }
    else if(f.kind==='video'){ const v=document.createElement('video'); v.src=f.url; v.muted=true; v.preload='metadata'; thumb.appendChild(v); const p=document.createElement('div'); p.className='play'; p.textContent='▶'; thumb.appendChild(p); }
    else if(f.kind==='pdf'){ const s=document.createElement('div'); s.className='ic'; s.textContent='PDF'; thumb.appendChild(s); }
    else { const s=document.createElement('div'); s.className='ic'; s.textContent='Fichier'; thumb.appendChild(s); }
    thumb.addEventListener('click',()=>openFileLightbox(f));

    const meta=document.createElement('div'); meta.className='fv-meta';
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=f.name; nm.title=f.name;
    const sub=document.createElement('div'); sub.className='sub';
    const d=new Date(f.added); const ds=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
    sub.textContent=[f.kind.toUpperCase(),fmtSize(f.bytes),ds].filter(Boolean).join(' · ');
    meta.appendChild(nm); meta.appendChild(sub);

    const ops=document.createElement('div'); ops.className='fv-ops';
    const dl=document.createElement('a'); dl.textContent='Télécharger';
    dl.href=f.url.replace('/upload/','/upload/fl_attachment/'); dl.setAttribute('download',''); dl.rel='noopener';
    const open=document.createElement('a'); open.textContent='Ouvrir'; open.href=f.url; open.target='_blank'; open.rel='noopener';
    const rm=document.createElement('button'); rm.className='rm'; rm.textContent='Supprimer';
    rm.addEventListener('click',()=>deleteFile(f));
    ops.appendChild(dl); ops.appendChild(open); ops.appendChild(rm);

    it.appendChild(thumb); it.appendChild(meta); it.appendChild(ops);
    grid.appendChild(it);
  });
  root.appendChild(grid);
}

/* lightbox fichiers (image agrandie, vidéo lisible, PDF -> ouvre l'onglet) */

function openFileLightbox(f){

/* ── divers ── */
function flash(m){ const h=document.getElementById('hint'); h.textContent=m; h.classList.add('show'); clearTimeout(h._t); h._t=setTimeout(()=>h.classList.remove('show'),2200); }

/* ── boot commun de l'UI ── */
function flattenIds(){ const ids=[0]; if(state&&state.boards)state.boards.forEach(b=>{(b.items||[]).forEach(i=>pushNum(ids,i.id));(b.connections||[]).forEach(k=>pushNum(ids,k.id));}); if(state&&state.albums)state.albums.forEach(a=>(a.images||[]).forEach(g=>pushNum(ids,g.id))); return ids; }
function pushNum(arr,id){ const n=parseInt(String(id).replace(/^[a-z]/,''),36); if(!isNaN(n))arr.push(n); }
function bootUI(){
  uid=Math.max(uid, ...flattenIds());
  ensureAlbums();
  renderBoardBar(); renderBoard(); renderAlbumBar(); buildPicker();
  document.getElementById('app').classList.add('on'); flagSaved();
}
function rerenderAll(){ ensureAlbums(); renderBoardBar(); renderBoard(); renderAlbumBar(); if(document.getElementById('gallery').classList.contains('on'))renderGallery(); if(document.getElementById('filesview').classList.contains('on'))renderFiles(); }

/* ── démarrage LOCAL (si pas de Firebase) ── */
function startLocal(){
  state=Store.load();
  if(!state||!state.boards||!state.boards.length){ state=defaultState(); }
  bootUI();
  setTimeout(()=>flash("Pince pour zoomer · « Relier » pour tracer des flèches"),700);
  window.addEventListener('storage',ev=>{ if(ev.key===KEY&&ev.newValue){ try{ state=JSON.parse(ev.newValue); rerenderAll(); }catch(e){} } });
}

/* ── application d'un état distant reçu par synchro ── */
let pendingRemote=null;
function applyRemote(j){
  try{
    const s=JSON.parse(j);
    const curBoard=state&&state.activeBoard, curAlbum=state&&state.activeAlbum;
    state=s;
    // garder l'onglet/tableau/album courant si toujours présent
    if(curBoard && (state.boards||[]).some(b=>b.id===curBoard)) state.activeBoard=curBoard;
    if(curAlbum && (state.albums||[]).some(a=>a.id===curAlbum)) state.activeAlbum=curAlbum;
    lastJSON=j;
    rerenderAll();
  }catch(e){}
}
function flushRemote(){
  if(pendingRemote && !isEditing() && !document.body.classList.contains('panning')){
    const j=pendingRemote; pendingRemote=null;
    if(j!==lastJSON) applyRemote(j);
  }
}
document.addEventListener('focusout',()=>setTimeout(flushRemote,80));

/* ── démarrage FIREBASE (synchro multi-appareils) ── */
async function startFB(){
  const db=firebase.firestore();
  fbDoc=db.collection('ateliers').doc(fbUser.uid);
  try{
    // Un seul get() — partagé entre repair et chargement initial
    const snap=await fbDoc.get();
    // réparer d'abord si des data: sont coincés dans le doc principal (ancien bug)
    if(snap.exists && snap.data().json){
      const s=JSON.parse(snap.data().json);
      const refs=collectImgRefs(s);
      if(refs.length){
        flash("Réparation en cours…");
        await saveImages(db,fbUser.uid,s);
        const light=stripImages(s);
        const j=JSON.stringify(light); lastJSON=j;
        await fbDoc.set({json:j,ts:Date.now()},{merge:true});
        state=light;
        flash("Réparation terminée ✓");
      } else {
        state=s; lastJSON=snap.data().json;
      }
    } else { state=defaultState(); persist(true); }
  }catch(e){ state=defaultState(); flash("Lecture impossible — vérifie les règles Firestore."); }
  bootUI();
  loadSiteOv();
  setTimeout(()=>flash("Synchronisé. Pince pour zoomer · « Relier » pour des flèches"),700);
  // état initial : on ne télécharge PAS les images (paresseux). On garde juste le JSON.
  fbDoc.onSnapshot(snap=>{
    if(!snap.exists||snap.metadata.hasPendingWrites)return;       // ignore nos propres écritures
    const j=snap.data().json; if(!j||j===lastJSON)return;          // rien de neuf
    if(isEditing()||document.body.classList.contains('panning')){  // ne pas interrompre une saisie / un déplacement
      pendingRemote=j; return;
    }
    applyRemote(j);
  });
}

/* ── gate ── */
const gate=document.getElementById('gate'), gateEmail=document.getElementById('gate-email'),
      gatePass=document.getElementById('gate-input'), gateErr=document.getElementById('gate-err');
function fbErr(e){
  const c=(e&&e.code)||'';
  if(c.includes('wrong-password')||c.includes('invalid-credential'))return"Email ou mot de passe incorrect.";
  if(c.includes('user-not-found'))return"Aucun compte avec cet email.";
  if(c.includes('too-many-requests'))return"Trop de tentatives, réessaie plus tard.";
  if(c.includes('network'))return"Pas de connexion.";
  return"Connexion impossible.";
}
function tryEnter(){
  if(USE_FB){
    gateErr.textContent="Connexion…";
    firebase.auth().signInWithEmailAndPassword(gateEmail.value.trim(),gatePass.value)
      .catch(e=>{ gateErr.textContent=fbErr(e); gatePass.value=""; });
  } else {
    if(gatePass.value===PASS){ try{sessionStorage.setItem('atelier_ok','1');}catch(e){} gate.classList.add('hidden'); startLocal(); }
    else { gateErr.textContent="Mot de passe incorrect."; gatePass.value=""; }
  }
}
document.getElementById('gate-btn').addEventListener('click',tryEnter);
gatePass.addEventListener('keydown',e=>{ if(e.key==='Enter')tryEnter(); });
gateEmail.addEventListener('keydown',e=>{ if(e.key==='Enter')gatePass.focus(); });

if(USE_FB){
  gateEmail.style.display='block';
  document.getElementById('gate-sub').textContent="Connecte-toi pour retrouver ton atelier synchronisé.";
  document.getElementById('logout').style.display='inline';
  document.getElementById('logout').addEventListener('click',e=>{ e.preventDefault(); firebase.auth().signOut(); });
  if(!window.firebase){ gateErr.textContent="Firebase n'a pas pu se charger (connexion ?)."; }
  else {
    firebase.initializeApp(FIREBASE_CONFIG);
    let booted=false;
    firebase.auth().onAuthStateChanged(u=>{
      if(u){ fbUser=u; gate.classList.add('hidden'); if(!booted){booted=true;startFB();} }
      else { fbUser=null; gate.classList.remove('hidden'); gateEmail.focus(); }
    });
  }
} else {
  try{ if(sessionStorage.getItem('atelier_ok')==='1'){ gate.classList.add('hidden'); startLocal(); } else gatePass.focus(); }
  catch(e){ gatePass.focus(); }
}
